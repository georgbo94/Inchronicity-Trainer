<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
  margin:0;
  font-family:monospace;
}

/* The app row */

.app{
  width:605px;
  transform-origin:top left;
  border:2px solid black;
  padding:10px;
  box-sizing:border-box;
}

/* just visual demo */
.row{
  display:flex;
  gap:10px;
}

input{
  width:80px;
}
</style>
</head>

<body>

<div class="app" id="app">
  <div class="row">
    <label>Tempo</label>
    <input type="number" value="120">
    <button>Start</button>
  </div>
</div>

<script>
function scaleApp(){

  const DESIGN = 605;
  const app = document.getElementById("app");

  const scale = Math.min(1, window.innerWidth / DESIGN);

  app.style.transform = `scale(${scale})`;

  /* CRITICAL: keep layout width equal to visual width */
  app.style.width = (DESIGN * scale) + "px";
}

window.addEventListener("resize", scaleApp);
window.addEventListener("load", scaleApp);
</script>

</body>
</html>
