<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Trainer Minimal</title>

<style>

html,body{
 margin:0;
 font-family:ui-monospace, monospace;
 background:#f4f4f4;
}

/* design width */

.appScale{
 width:605px;
 margin:auto;
}

/* scale down if smaller screen */

@media (max-width:605px){
 .appScale{
  transform:scale(calc(100vw / 605));
  transform-origin:top center;
 }
}

/* theme */

:root{
 --card:#f7f7f7;
 --border:#cfcfcf;
 --text:#111;
 --radius:18px;
}

.wrap{
 padding:20px 0 30px;
}

.card{
 background:var(--card);
 border:1.5px solid var(--border);
 border-radius:var(--radius);
 padding:14px;
}

.row{
 display:grid;
 grid-template-columns:90px 1fr;
 column-gap:10px;
 align-items:center;
 margin:8px 0;
}

.label{
 white-space:nowrap;
}

.controls{
 display:flex;
 align-items:center;
 gap:8px;
}

input{
 font-family:inherit;
 font-size:16px;
 padding:6px;
 border:1.5px solid var(--border);
 border-radius:12px;
 width:70px;
}

.btn{
 width:100%;
 margin-top:18px;
 padding:12px;
 border-radius:14px;
 border:1.5px solid var(--border);
 background:#f2f2f2;
 font-size:18px;
 font-weight:600;
 cursor:pointer;
}

</style>
</head>

<body>

<div class="appScale">
<div class="wrap">

<div class="card">

<div class="row">
<div class="label">Tempo</div>
<div class="controls">
<input type="number" value="120"/>
<span>BPM</span>
</div>
</div>

<div class="row">
<div class="label">Length</div>
<div class="controls">
<input type="number" value="16"/>
<span>subs</span>
</div>
</div>

<button class="btn">Start</button>

</div>

</div>
</div>

</body>
</html>
